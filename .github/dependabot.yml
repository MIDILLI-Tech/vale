version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One PR per week for routine action bumps instead of one per action.
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Routine library bumps land in a single PR; majors stay individual so
      # each one can be reviewed against its own migration notes.
      composer-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    ignore:
      # Symfony 8+ and PHPUnit 13+ require PHP >= 8.4.1 while the development
      # baseline (local + CI) is PHP 8.3. Drop these rules when the baseline moves.
      - dependency-name: "symfony/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "phpunit/phpunit"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
