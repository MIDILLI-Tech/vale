name: Publish Docker Edge Images

# Edge channel: every master push that touches runtime code republishes the
# pre-release images. Edge builds only ever move the `edge*` and `mutable-*`
# tags — `latest` stays on the newest release tag.
#
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (scoped read/write access token)

on:
  push:
    branches:
      - master
    paths:
      - 'docker/**'
      - '.dockerignore'
      - '.github/workflows/docker-*.yml'
      - 'scripts/publish-docker.php'
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'public/**'
      - 'resources/**'
      - 'routes/**'
      - 'src/**'
      - 'themes/**'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push to Docker Hub (uncheck for a build + smoke only run)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: docker-edge
  cancel-in-progress: true

jobs:
  edge:
    runs-on: ubuntu-latest
    name: Publish edge images

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, sodium, curl
          coverage: none

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name == 'push' || inputs.push
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, smoke test and push edge images
        env:
          PUSH_INPUT: ${{ inputs.push }}
        run: |
          set -eu

          ARGS=(--edge --flavor=all --variants=apache,nginx --smoke)
          if [ "${{ github.event_name }}" = "push" ] || [ "$PUSH_INPUT" = "true" ]; then
            ARGS+=(--push)
          fi

          php scripts/publish-docker.php "${ARGS[@]}"
