name: Lint Changed Files (PHP + Twig)

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  lint-changed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, sodium
          tools: composer:v2

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --no-suggest

      - name: Run changed-file lint (PHP + Twig + JS)
        run: php scripts/lint/lint-changed.php
