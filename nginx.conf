# Vale Nginx config (panel-managed root mode)
#
# Use this when your hosting panel already controls document root and
# only lets you add custom Nginx directives.
#
# IMPORTANT:
# - Paste this INSIDE your existing server {} block.
# - Do not add another server {} block if panel already provides one.
# - Ask host support to point document root to /public when possible.
# - Replace PHP_FPM with your host value (example: 127.0.0.1:9000).

# Allow larger file uploads
client_max_body_size 128M;

# Block WordPress probe endpoints (no such routes in Vale)
location = /xmlrpc.php {
    return 404;
}

# Front controller routing
location / {
    try_files $uri $uri/ /index.php$is_args$args;
}

# Block hidden files (.env, .git, etc.)
location ~ /\. {
    deny all;
}

# Block access to sensitive files
location ~ ^/(composer\.(json|lock)|phinx\.php)$ {
    deny all;
}

# Block direct access to sensitive directories
location ~ ^/(app|bootstrap|config|database|routes|src|storage|vendor|resources)(/|$) {
    deny all;
}

# Long-lived cache for versioned build assets (?v= cache-busting via asset())
location ~* ^/assets/.+\.(css|js|woff2|woff|ttf|svg)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# PHP handling
location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_pass PHP_FPM;
    fastcgi_read_timeout 300;
}
