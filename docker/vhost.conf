<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    # Match PHP max_execution_time so bulk operations (e.g. media scan) are not cut off early
    Timeout 120

    <Directory /var/www/html/public>
        # No Indexes: a directory listing must never be a fallback when a
        # folder is hit directly. FollowSymLinks stays for mod_rewrite.
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/public/assets>
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=31536000, immutable"
        </IfModule>
        <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresDefault "access plus 1 year"
        </IfModule>
    </Directory>

    # Uploads live in the storage volume (config/media.php writes to
    # storage/uploads) and are served straight from there. The app never sees
    # these requests, so sniffing protection must be set here — the shared PHP
    # fallback (bootstrap/serve-upload.php) applies the same header for
    # non-Docker installs.
    Alias /uploads /var/www/html/storage/uploads
    <Directory /var/www/html/storage/uploads>
        Options -Indexes
        AllowOverride None
        Require all granted

        # Uploads are user-supplied bytes: never execute them, and never hand
        # out source or markup (matches bootstrap/serve-upload.php).
        <FilesMatch "\.(php\d?|phtml|pht|phar|cgi|pl|py|sh|html?|xhtml|shtml)$">
            Require all denied
        </FilesMatch>

        # Hidden files are configuration by convention (.env, .htaccess):
        # never serve them from the media volume, even if one was dropped
        # there by hand.
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>

        <IfModule mod_headers.c>
            Header set X-Content-Type-Options "nosniff"
        </IfModule>
        # Subtitle + Matroska types may be missing from the server-wide
        # mime config. AddType is additive in Apache (unlike nginx `types {}`),
        # so inherited png/jpg/mp4 mappings stay intact.
        <IfModule mod_mime.c>
            AddType text/vtt .vtt
            AddType application/x-subrip .srt
            AddType video/webm .webm
            AddType video/x-matroska .mkv
        </IfModule>
    </Directory>

    # Hidden directories (.git, .config, …): deny the whole subtree. The
    # FilesMatch blocks above only see file names, so a normal-named file
    # inside a dot directory would otherwise still be served (same rule as
    # bootstrap/serve-upload.php and the nginx dotfile location).
    <DirectoryMatch "^/var/www/html/storage/uploads.*/\.[^/]+">
        Require all denied
    </DirectoryMatch>

    Alias /themes /var/www/html/themes
    <Directory /var/www/html/themes>
        Options FollowSymLinks
        Require all granted

        <FilesMatch "\.(php|txt|json|md|yaml|yml|twig)$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
