; Vale container PHP configuration
; Guarantees that $_ENV is populated from the real container environment
; (CapRover App Environment / Docker env vars), even if a php.ini with
; variables_order=GPCS would otherwise be loaded.
variables_order = "EGPCS"

; Route all PHP errors and error_log() calls to stderr so Docker captures them
log_errors = On
error_log = /proc/self/fd/2

; Never print notices/warnings into the HTTP response body (they corrupt JSON
; responses). Errors stay in the container log instead. The official php image
; defaults to display_errors=On when no main php.ini is mounted, so set this
; explicitly.
display_errors = Off
display_startup_errors = Off
html_errors = Off

; Increase file upload and memory limits for media handling.
; These are defaults only: docker/entrypoint.sh rewrites upload_max_filesize,
; post_max_size, memory_limit, max_execution_time and max_input_time from the
; UPLOAD_MAX_FILESIZE / POST_MAX_SIZE / MEMORY_LIMIT / MAX_EXECUTION_TIME /
; MAX_INPUT_TIME environment variables at container start.
upload_max_filesize = 128M
post_max_size = 128M
memory_limit = 512M

; Bulk operations (e.g. large media libraries) need more than PHP's 30s default
max_execution_time = 120
max_input_time = 120
