server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    index index.php;

    charset utf-8;

    client_max_body_size 128M;

    location ~* ^/assets/.+\.(css|js|woff2|woff|ttf|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Hidden files are configuration by convention (.htaccess, .env, .git):
    # public/.htaccess IS tracked in the repo for Apache installs, so on nginx
    # it would otherwise be served as a static file. Deny every hidden file in
    # every location — the /uploads/ dotfile rule below is redundant with this
    # but kept explicitly for the alias'ed media volume.
    location ~ /\. {
        return 403;
    }

    # Block WordPress probe endpoints (no such routes in Vale)
    location = /xmlrpc.php {
        return 404;
    }

    # Match /assets/build/ or other /assets/ paths
    location /assets/ {
        try_files $uri =404;
    }

    # Uploads live in the storage volume (config/media.php writes to
    # storage/uploads) and are served straight from there — no symlink inside
    # public/, so a mounted or pre-populated public/uploads cannot shadow them.
    location /uploads/ {
        alias /var/www/html/storage/uploads/;

        # Uploads are user-supplied bytes — the app middleware never sees these
        # requests, so sniffing protection must come from here. Note: a
        # `types {}` block would REPLACE the inherited mime.types for this
        # location, so unknown extensions get the binary default instead
        # (rar, 7z, docx, … download rather than render).
        add_header X-Content-Type-Options nosniff;
        default_type application/octet-stream;
    }

    # Hidden files are configuration by convention (.env, .htaccess): never
    # serve them from the media volume, even if one was dropped there by hand.
    # Declared before the extension deny list so a dotfile is refused whatever
    # its extension (same rule as bootstrap/serve-upload.php).
    location ~* ^/uploads/(?:.*/)?\. {
        return 403;
    }

    # Uploads are user-supplied bytes: never hand them to PHP-FPM, and never
    # serve source or markup. This regex is declared before the generic
    # `\.php$` location so it wins the match (same list as the shared PHP
    # fallback, bootstrap/serve-upload.php).
    location ~* ^/uploads/.*\.(php\d?|phtml|pht|phar|cgi|pl|py|sh|html?|xhtml|shtml)$ {
        return 403;
    }

    # Subtitle + Matroska types missing from nginx:alpine's mime.types.
    # Without these, .vtt is served as octet-stream (downloaded, never
    # rendered) and <track> never loads. Regex locations win over the
    # /uploads/ prefix; `alias` needs the capture because the files live
    # outside the document root. `default_type` sets the Content-Type per
    # extension; the upload endpoint only stores valid media, so explicit
    # types here cannot turn user input into script.
    # Deliberately NO try_files in these locations: inside a regex location
    # using `alias` with a capture, try_files resolves $uri against the document
    # root instead of the alias, so every file mismatches and falls back to the
    # 404 error page (verified in a container). A missing file already 404s
    # when nginx fails to open the aliased path.
    location ~* ^/uploads/(.+\.vtt)$ {
        alias /var/www/html/storage/uploads/$1;
        add_header X-Content-Type-Options nosniff;
        default_type text/vtt;
    }

    location ~* ^/uploads/(.+\.srt)$ {
        alias /var/www/html/storage/uploads/$1;
        add_header X-Content-Type-Options nosniff;
        default_type application/x-subrip;
    }

    location ~* ^/uploads/(.+\.mkv)$ {
        alias /var/www/html/storage/uploads/$1;
        add_header X-Content-Type-Options nosniff;
        default_type video/x-matroska;
    }

    # Theme assets — only images are publicly accessible. Root-based on
    # purpose (resolves /var/www/html + URI directly): a regex location +
    # `alias` without a rewrite capture mis-maps every file, and with a
    # capture it double-joins the /themes/ prefix. Root keeps try_files
    # correct and keeps the images-only allow-list simple.
    location ~* ^/themes/.+\.(?:png|jpe?g|webp)$ {
        root /var/www/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Block all other theme files (PHP, config, templates, etc.)
    location /themes/ {
        return 403;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Standard PHP-FPM port in Docker images
        fastcgi_pass 127.0.0.1:9000;
        # Match PHP max_execution_time so bulk operations (e.g. media scan) are not cut off early
        fastcgi_send_timeout 120s;
        fastcgi_read_timeout 120s;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
